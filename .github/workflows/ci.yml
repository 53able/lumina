# ビルド・テスト・型チェック・リントを実行する CI
name: CI

on:
  push:
    branches: [main]
  # スタックPR（main 以外が base）でも CI を動かすため、branches を指定しない
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version は package.json の packageManager を参照

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:check

      # ロガー呼び出しの引数でエラーを文字列にしていないか検査する（rg を使う）
      - name: Install ripgrep
        run: command -v rg || (sudo apt-get update && sudo apt-get install -y ripgrep)

      - name: Lint logs
        run: pnpm lint:logs

      # lint:logs の正規表現が違反のサンプル（tests/fixtures/logLint）を検出できることを確かめる
      - name: Lint logs selftest
        run: pnpm lint:logs:selftest

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version は package.json の packageManager を参照

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
